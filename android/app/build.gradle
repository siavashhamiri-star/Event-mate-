plugins {
    id 'com.android.application'
}

android {
    namespace "com.eventmate.vip"
    compileSdk 34

    defaultConfig {
        applicationId "com.eventmate.vip"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../eventmate-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "EventMateVIP2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "eventmate_vip"
            keyPassword System.getenv("KEY_PASSWORD") ?: "EventMateVIP2026"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
