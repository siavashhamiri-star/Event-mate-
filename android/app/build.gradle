plugins {
    id 'com.android.application'
}

// Secure API & Signing Environment Automation Helper
def getSecureEnvOrProp = { String envKey, String propKey, String fallbackValue ->
    def envVal = System.getenv(envKey)
    if (envVal != null && !envVal.trim().isEmpty()) {
        return envVal.trim()
    }
    if (project.hasProperty(propKey)) {
        return project.property(propKey).toString().trim()
    }
    return fallbackValue
}

android {
    namespace "com.eventmate.vip"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.eventmate.vip"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Automated Server Proxy Endpoint (Private API Keys remain 100% isolated in server.ts)
        def apiBaseUrl = getSecureEnvOrProp("EVENTMATE_API_BASE_URL", "EVENTMATE_API_BASE_URL", "https://eventmate-vip.fbnm.stage")
        def publicClientId = getSecureEnvOrProp("GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_ID", "configured-via-server-proxy")

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "SERVER_PROXY_CONCIERGE", "\"${apiBaseUrl}/api/concierge\""
        buildConfigField "String", "SERVER_PROXY_RATES", "\"${apiBaseUrl}/api/rates\""
        buildConfigField "String", "PUBLIC_OAUTH_CLIENT_ID", "\"${publicClientId}\""

        manifestPlaceholders = [
            appHostUrl: apiBaseUrl
        ]
    }

    signingConfigs {
        release {
            // Supports automated GitHub Secrets (KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)
            // with automatic zero-config fallback to CI-generated RSA-2048 keystore
            storeFile file(getSecureEnvOrProp("KEYSTORE_FILE", "RELEASE_STORE_FILE", "../eventmate-release.keystore"))
            storePassword getSecureEnvOrProp("KEYSTORE_PASSWORD", "RELEASE_STORE_PASSWORD", "EventMateVIP2026")
            keyAlias getSecureEnvOrProp("KEY_ALIAS", "RELEASE_KEY_ALIAS", "eventmate_vip")
            keyPassword getSecureEnvOrProp("KEY_PASSWORD", "RELEASE_KEY_PASSWORD", "EventMateVIP2026")
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
