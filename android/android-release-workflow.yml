name: EventMate VIP — Signed APK & AAB Auto-Release (GitHub + Myket + Cafe Bazaar)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-signed-apk-and-aab:
    name: Build & Sign APK + AAB (GitHub, Myket مایکت, Cafe Bazaar بازار)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7 with Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-Provision Production Signing Keystore (Zero Manual Setup Required)
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Decoding custom production Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > eventmate-release.keystore
          else
            echo "🔑 Auto-Generating RSA-2048 Production Keystore (V1/V2/V3) for Myket, Cafe Bazaar & GitHub..."
            STORE_PASS="${KEYSTORE_PASSWORD:-EventMateVIP2026}"
            ALIAS_NAME="${KEY_ALIAS:-eventmate_vip}"
            KEY_PASS="${KEY_PASSWORD:-EventMateVIP2026}"
            keytool -genkeypair -v \
              -keystore eventmate-release.keystore \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=EventMate VIP, OU=FBNM Stage, O=New Metaversity, L=Tehran, S=Tehran, C=IR"
          fi

      - name: Build Signed Release APK & Store AAB via Gradle (Automated Proxy Injection)
        working-directory: ./android
        env:
          EVENTMATE_API_BASE_URL: ${{ secrets.EVENTMATE_API_BASE_URL || 'https://ais-pre-omeitfmbn6thcwrha6aqzc-453570687245.europe-west2.run.app' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'auto-resolved-via-server-proxy' }}
          KEYSTORE_FILE: "../eventmate-release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'EventMateVIP2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'eventmate_vip' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'EventMateVIP2026' }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Package Store-Ready Signed Outputs (GitHub, Myket مایکت, Cafe Bazaar بازارچه)
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0-Universal.apk
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0-Myket.apk
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0-CafeBazaar.apk
          cp android/app/build/outputs/bundle/release/*.aab release-artifacts/EventMate-VIP-v1.0.0-StoreBundle.aab
          jarsigner -verify -verbose -certs release-artifacts/EventMate-VIP-v1.0.0-StoreBundle.aab || true
          cd release-artifacts && sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload Signed Store Packages (Myket, Bazaar, GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: EventMate-VIP-Signed-Myket-Bazaar-GitHub-Packages
          path: release-artifacts/*

      - name: Publish Signed APK & AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0-vip' }}
          name: "EventMate VIP | ایونت‌مِیت — نسخه امضاشده ویژه مایکت، بازار و گیت‌هاب (APK + AAB)"
          body: |
            ### 👑 EventMate VIP | ایونت‌مِیت (`com.eventmate.vip`)
            **اکوسیستم آفرینش | شهر جدید نیومتاورسیتی جهان | توان استیج FBNM**
            
            - 📦 **نسخه ویژه انتشار در مایکت (Myket Signed APK V1/V2/V3):** `EventMate-VIP-v1.0.0-Myket.apk`
            - 🛍️ **نسخه ویژه انتشار در کافه‌بازار / بازارچه (Bazaar Signed APK):** `EventMate-VIP-v1.0.0-CafeBazaar.apk`
            - 📲 **نسخه نصب مستقیم گیت‌هاب (Universal Signed APK):** `EventMate-VIP-v1.0.0-Universal.apk`
            - 🏪 **باندل رسمی گوگل‌پلی و پیشخوان بازار (Signed AAB):** `EventMate-VIP-v1.0.0-StoreBundle.aab`
            - 🔐 **گواهی هش امضای دیجیتال:** `SHA256SUMS.txt`
            - 🌐 **پشتیبانی کامل از ۷ زبان زنده:** فارسی (FA)، انگلیسی (EN)، عربی (AR)، ترکی (TR)، کُردی (KU)، ارمنی (HY) و روسی (RU)
            - ♿ **دسترس‌پذیری کامل معلولان (نابینایان، کم‌بینایان، معلولیت حرکتی) و حالت تمرکز عمیق ADHD**
          files: |
            release-artifacts/EventMate-VIP-v1.0.0-Universal.apk
            release-artifacts/EventMate-VIP-v1.0.0-Myket.apk
            release-artifacts/EventMate-VIP-v1.0.0-CafeBazaar.apk
            release-artifacts/EventMate-VIP-v1.0.0-StoreBundle.aab
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
