name: EventMate VIP — Android APK & AAB Auto-Release (FBNM)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk-and-aab:
    name: Build Signed APK & Play Store AAB (com.eventmate.vip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Production Keystore for com.eventmate.vip
        working-directory: ./android
        run: |
          keytool -genkeypair -v \
            -keystore eventmate-release.keystore \
            -alias eventmate_vip \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass EventMateVIP2026 \
            -keypass EventMateVIP2026 \
            -dname "CN=EventMate VIP, OU=FBNM Stage, O=New Metaversity, L=Tehran, S=Tehran, C=IR"

      - name: Build Release APK & Android App Bundle (AAB)
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/*.apk release-artifacts/EventMate-VIP-v1.0.0.apk || true
          cp android/app/build/outputs/bundle/release/*.aab release-artifacts/EventMate-VIP-v1.0.0.aab || true

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EventMate-VIP-Android-Packages
          path: release-artifacts/*

      - name: Publish APK & AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0-vip' }}
          name: "EventMate VIP | ایونت‌مِیت — نسخه اندروید (APK + AAB)"
          body: |
            ### 👑 EventMate VIP | ایونت‌مِیت (`com.eventmate.vip`)
            **اکوسیستم آفرینش | شهر جدید نیومتاورسیتی جهان | توان استیج FBNM**
            
            - 📦 **فایل نصبی مستقیم اندروید (APK):** `EventMate-VIP-v1.0.0.apk`
            - 🏪 **باندل رسمی گوگل‌پلی و کافه‌بازار (AAB):** `EventMate-VIP-v1.0.0.aab`
            - ✨ منوساز زنده، محاسبه‌گر اقساط چک صیادی، تقویم شب‌های خالی تالار، استوری‌ساز HD و اتصال جیمیل و واتساپ.
          files: |
            release-artifacts/EventMate-VIP-v1.0.0.apk
            release-artifacts/EventMate-VIP-v1.0.0.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
